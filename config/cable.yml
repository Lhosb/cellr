# Async adapter only works within the same process, so for manually triggering cable updates from a console,
# and seeing results in the browser, you must do so from the web console (running inside the dev process),
# not a terminal started via bin/rails console! Add "console" to any action or any ERB template view
# to make the web console appear.
development:
  adapter: async

test:
  adapter: test

# Production broadcasts are pushed in-process to the connected WebSockets: no
# database polling (Solid Cable polled every 0.1s and kept Neon awake). This is only
# correct while the app runs as ONE Puma process on ONE server. If WEB_CONCURRENCY
# goes above 1 or a second server is added, switch to the `postgresql` adapter
# (LISTEN/NOTIFY, still push-based) or `redis`.
production:
  adapter: async
